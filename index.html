<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Soft Interactions</title>
  <meta name="description" content="Nadine, Product & UX Designer in Aachen. Ask about her work, projects and results in a small chat that runs in your browser.">
  <meta property="og:title" content="Soft Interactions · Nadine, Product & UX Designer">
  <meta property="og:description" content="Ask about Nadine's work: projects, results and how she works. In German or English.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://nadineux.com/">
  <meta name="theme-color" content="#101216">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="chat-page">
  <div class="chat-app">
    <header class="chat-header">
      <a class="logo" href="./" aria-label="Nadine UX, home">nadine<span>ux</span></a>
      <div class="chat-controls">
        <button class="chat-reset" type="button">New chat</button>
        <div class="lang-toggle" role="group" aria-label="Language">
          <button type="button" data-lang-btn="de" aria-pressed="false">DE</button>
          <button type="button" data-lang-btn="en" aria-pressed="true">EN</button>
        </div>
      </div>
    </header>

    <main class="chat-main">
      <section class="chat-hero">
        <span class="frame-label">Nadine · Product &amp; UX Designer · Aachen</span>
        <h1>Soft <span class="sel">interactions<span class="sel-box" aria-hidden="true"><i></i><i></i><i></i><i></i><b class="sel-dim">Hug × Hug</b></span></span></h1>
        <p class="chat-lede">Ask me anything about Nadine's work: projects, results, how she works.</p>
      </section>
      <div class="chat-log" role="log" aria-live="polite" aria-relevant="additions"></div>
    </main>

    <div class="chat-dock">
      <form class="composer" autocomplete="off">
        <span class="composer-handles" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <label class="visually-hidden" for="chat-input">Your question</label>
        <textarea id="chat-input" rows="1" placeholder="Ask about Nadine's work …"></textarea>
        <button class="composer-mic" type="button" aria-label="Ask by voice">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button class="composer-send" type="submit" aria-label="Send" disabled>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
      <div class="starters">
        <span class="starters-label mono">For example</span>
        <div class="starters-chips q-chips"></div>
      </div>
      <p class="privacy mono"><span class="privacy-text">Runs in your browser: typed questions never leave this page.</span> · <a class="classic-link" href="classic.html">Classic view</a></p>
    </div>
    <div class="chat-spacer" aria-hidden="true"></div>
  </div>

  <script src="assets/kb.js" defer></script>
  <script src="assets/chat.js" defer></script>
  <script src="assets/main.js" defer></script>
</body>
</html>
